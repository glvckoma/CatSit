name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore CatSit.sln

      - name: Build
        run: dotnet build CatSit.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/CatSit.Core.Tests/CatSit.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish self-contained exe
        run: >
          dotnet publish src/CatSit/CatSit.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CatSit.iss /DMyAppVersion=${{ steps.version.outputs.version }}
        shell: pwsh

      - name: Rename bare exe for release clarity
        shell: pwsh
        run: Copy-Item publish\CatSit.exe "publish\CatSit-${{ steps.version.outputs.version }}-portable.exe"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/CatSit-${{ steps.version.outputs.version }}-portable.exe
            installer/Output/CatSit-Setup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
