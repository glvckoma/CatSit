name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CatSit.sln

      - name: Build
        run: dotnet build CatSit.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/CatSit.Core.Tests/CatSit.Core.Tests.csproj -c Release --no-build --verbosity normal
